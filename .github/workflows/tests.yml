name: Tests

# Quand lancer les tests : à chaque push, sur n'importe quelle branche,
# et à chaque Pull Request vers main.
on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04

    # On teste la version minimale et la version maximale de Python supportées.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Installer les bibliothèques système (OpenCV)
        run: sudo apt-get update && sudo apt-get install -y libgl1

      - name: Installer les dépendances Python
        # L'index PyTorch "cpu" évite de télécharger la version GPU (plusieurs Go),
        # inutile sur les machines de GitHub.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Lancer les tests
        run: pytest -v